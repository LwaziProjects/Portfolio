name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # Only the site folder is published. The legacy Django code stays in the repo but off the web.
      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
