name: Django Portfolio CI/CD

on:
  # Runs on push to any of the below branches
  push:
    branches:
      - main
      - develop

  # Runs on pull request events that target one of the below branches
  pull_request:
    branches:
      - main
      - develop

  # Allows you to run this workflow manually from the Actions tab of the repository
  workflow_dispatch:

env:
  # Python version to use
  PYTHON_VERSION: 3.14.0
  
  # Django version
  DJANGO_VERSION: 4.2.26
  
  # Ensures Python uses UTF-8 encoding by default
  PYTHONUTF8: 1

jobs:
  test-and-lint:
    name: Test and Lint Django Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pylint

    - name: Run flake8 linting
      continue-on-error: true
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      continue-on-error: true
      run: |
        black --check --diff .

    - name: Run Django checks
      run: |
        python manage.py check --deploy

    - name: Run Django migrations check
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Django tests
      run: |
        python manage.py test --verbosity=2

    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput --verbosity=2

  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit

    - name: Run safety check for vulnerabilities
      continue-on-error: true
      run: |
        safety check --json

    - name: Run bandit security linter
      continue-on-error: true
      run: |
        bandit -r . -ll

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          lwazi28/portfolio:latest
          lwazi28/portfolio:${{ github.sha }}

    - name: Output image URLs
      run: |
        echo "### 🐳 Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🔗 View on Docker Hub:**" >> $GITHUB_STEP_SUMMARY
        echo "https://hub.docker.com/r/lwazi28/portfolio" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📥 Pull the image:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull lwazi28/portfolio:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🚀 Run locally:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker run -d -p 8000:8000 lwazi28/portfolio:latest" >> $GITHUB_STEP_SUMMARY
        echo "# Access at: http://localhost:8000" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY



  upload-coverage:
    name: Upload Test Coverage
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies with coverage
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Run tests with coverage
      run: |
        coverage run --source='.' manage.py test
        coverage report
        coverage xml

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  notify-success:
    name: Notify Build Success
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: success()

    steps:
    - name: Success notification
      run: |
        echo "### ✅ Portfolio CI/CD Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎉 All tests passed and Docker images published!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ Quick Links:**" >> $GITHUB_STEP_SUMMARY
        echo "- 🐳 [View Image on Docker Hub](https://hub.docker.com/r/lwazi28/portfolio)" >> $GITHUB_STEP_SUMMARY
        echo "- � [View Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
        echo "- � [View Workflow Runs](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
